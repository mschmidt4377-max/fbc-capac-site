# Every Sunday, saves any new Sunday service from Facebook as an MP3
# (tools/archive-sermons.mjs). Facebook deletes live videos after 30 days;
# the later runs catch a service that wasn't posted yet at 12:45.
name: Archive sermons

on:
  workflow_dispatch:
  schedule:
    # GitHub starts scheduled runs late (sometimes hours) or skips them. So we
    # try many times: 12:45 PM Michigan time, then every hour at :17 until
    # about 8 PM. Cron runs in UTC, so the times cover both EDT and EST.
    # 8 PM Sunday Eastern is already Monday in UTC, hence day 1 on that line.
    # A run that finds no new video does nothing, so extra tries are harmless.
    - cron: '45 16,17 * * 0'   # 12:45 PM (EDT, EST)
    - cron: '17 17-23 * * 0'   # 1:17 PM to 7:17 PM
    - cron: '17 0,1 * * 1'     # 8:17 PM Sunday (EDT, EST)

permissions:
  contents: write
  actions: write

concurrency:
  group: sermon-archive
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install tools
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q ffmpeg
          pipx install yt-dlp
          # Voice detector that finds where the sermon starts (tools/find-sermon-start.py).
          pip install -q faster-whisper==1.2.1
          cd tools && npm ci && npx playwright install --with-deps chromium

      - name: Save new sermons
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tools/archive-sermons.mjs

      - name: Commit the sermon list
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add site/assets/data/sermons.json site/assets/data/sermon.json
          if ! git diff --cached --quiet; then
            git config user.name "sermon-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Archive new sermon audio"
            git pull --rebase
            git push
            # A push made by this robot does not start other workflows, so ask for a deploy.
            if [ "${{ vars.DEPLOY_SITE }}" = "true" ]; then gh workflow run deploy.yml; fi
          fi
