# Publishes site/ to GitHub Pages on every push. The sermon archive workflow
# also starts it after it saves a new sermon.
name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    # Off until the repo variable DEPLOY_SITE is set to true (Settings > Secrets
    # and variables > Actions > Variables), so nothing publishes before launch.
    if: vars.DEPLOY_SITE == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
